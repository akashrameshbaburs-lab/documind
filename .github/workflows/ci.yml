name: CI

on:
  push:
  pull_request:

jobs:
  app:
    name: Build, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  gpu-sidecar:
    name: GPU sidecar syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile FastAPI app
        run: |
          if [ -d gpu-inference/app ]; then
            python -m compileall -q gpu-inference/app
          fi

  compose:
    name: Compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml config -q
      - run: docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q
