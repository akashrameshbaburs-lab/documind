# ---------------------------------------------------------------------------
# DocuMind AI - docker compose stack
#   app      : Express + RAG pipeline   (host 3200 -> container 3200)
#   postgres : pgvector/pgvector:pg16   (host 5434 -> container 5432)
#
# Ports intentionally avoid 8080 / 5432 / 6379 / 3100 / 5433 which are used by
# sibling projects.
# ---------------------------------------------------------------------------
name: documind

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind
      POSTGRES_DB: documind
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind -d documind"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  app:
    build:
      context: .
      target: runtime
    ports:
      - "3200:3200"
    environment:
      PORT: 3200
      DATABASE_URL: postgres://documind:documind@postgres:5432/documind
      JWT_SECRET: ${JWT_SECRET:-compose-dev-secret-please-override}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@documind.local}
      MAX_QUERIES_PER_DAY: ${MAX_QUERIES_PER_DAY:-100}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-15}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional: set OPENAI_API_KEY in your shell/.env to switch to LLM mode.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
